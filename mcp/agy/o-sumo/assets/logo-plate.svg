<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="#FFF7ED"/>
  <!-- Background circle with margin -->
  <circle cx="128" cy="128" r="108" fill="url(#grad)" />
  <!-- Dohyo inner ring (sand color) -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#FDE68A" stroke-width="8" stroke-dasharray="14 4"/>
  <!-- Dohyo center mark (shikiri-sen lines) -->
  <line x1="112" y1="84" x2="144" y2="84" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="112" y1="200" x2="144" y2="200" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- Traditional Gunbai (referee fan) / Sumo character silhouette -->
  <text x="128" y="136" font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">相撲</text>
</svg>
