name: Realtime Torikumi Direct Update
on:
  schedule:
    - cron: '*/10 4-9 * * *'
  workflow_dispatch:
# Wrapper only triggers the reusable workflow; the reusable uses its own
# write token (GH_PAT) and does not inherit permissions from the caller.
permissions: {contents: read}
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/data-update.yml
    with:
      scope: result
      event_schedule: ${{ github.event.schedule || '' }}
    secrets: inherit
