name: Realtime Torikumi Direct Update
on:
  schedule:
    - cron: '*/10 4-9 * * *'
  workflow_dispatch:
permissions: {contents: write, checks: read, actions: read}
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/data-update.yml
    with:
      scope: result
      event_schedule: ${{ github.event.schedule || '' }}
    secrets: inherit
