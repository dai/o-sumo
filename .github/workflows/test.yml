name: Test

on:
  pull_request_target:
  push:
    branches:
      - main
      - codex/**
      - automation/data-updates

jobs:
  test:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Install workflow test dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Test data parsers and workflow operations
        run: |
          python -m unittest scripts.update_sumo_data_parser_test scripts.ci.validate_torikumi_test scripts.ci.workflow_summary_test scripts.ci.workflow_config_test
          bash scripts/ci/push_realtime_update_test.sh

      - name: Generate standalone blog
        run: npm run blog:generate

      - name: Verify tracked blog feed is current
        run: git diff --exit-code -- public/api/v1/blog.json

      - name: Build app
        run: npm run build
