name: Test

# Runs unit, type, blog, and build checks on PRs and protected branch pushes.
# `automation/data-updates` keeps the bot's auto-generated update branch green.
on:
  pull_request_target:
  push:
    branches:
      - main
      - codex/**
      - automation/data-updates

# Tests only need to read source. No write, no PR comment, no deploy surface.
permissions:
  contents: read

jobs:
  test:
    # SECURITY: For pull_request_target, only run when the PR originates from
    # the same repository. A fork PR (`head.repo.full_name != repository`)
    # could otherwise exfiltrate `secrets.GITHUB_TOKEN` via `actions/checkout`.
    # Do NOT relax this guard without re-reading
    # https://securitylab.github.com/research/github-actions-preventing-pwn-requests/.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Install workflow test dependencies
        run: python -m pip install PyYAML==6.0.3

      - name: Test data parsers and workflow operations
        run: |
          python -m unittest scripts.update_sumo_data_parser_test scripts.ci.validate_torikumi_test scripts.ci.validate_news_test scripts.ci.workflow_summary_test scripts.ci.workflow_config_test scripts.update_news_feed_test scripts.ci.news_state_test scripts.ci.run_data_update_test scripts.ci.data_publish_test scripts.ci.check_data_delivery_test
          bash scripts/ci/push_realtime_update_test.sh

      - name: Generate standalone blog
        run: npm run blog:generate

      # fail-fast: a stale tracked blog.json means the PR author skipped
      # `npm run blog:generate` locally. Block until regenerated.
      - name: Verify tracked blog feed is current
        run: git diff --exit-code -- public/api/v1/blog.json

      - name: Build app
        run: npm run build
