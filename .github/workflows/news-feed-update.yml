name: News Feed Update
on:
  schedule:
    # Acquire at 09:05 JST; keep the final publication slot separate.
    - cron: '5 0 * * *'
    - cron: '5 10 * * *'
  workflow_dispatch:
permissions: {contents: write, checks: read, actions: read}
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/data-update.yml
    with:
      scope: news
      event_schedule: ${{ github.event.schedule || '' }}
    secrets: inherit
