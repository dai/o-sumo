name: Daily Sumo Data Update

on:
  schedule:
    - cron: '0 4,6,8,10 * * *'
  workflow_dispatch:

concurrency:
  group: osumo-torikumi-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# Discord 通知 (任意): secrets.DISCORD_WEBHOOK_URL が無いと wf はそのまま動く。

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate schedule data
        id: generate
        shell: bash
        run: |
          bash scripts/ci/run_torikumi_generator.sh \
            --torikumi-only \
            --torikumi-scope schedule \
            2> >(tee "$RUNNER_TEMP/torikumi-generator.stderr" >&2)

      - name: Validate torikumi payload
        id: validate
        shell: bash
        run: python scripts/ci/validate_torikumi.py

      - name: Print torikumi timestamps
        id: inspect
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          torikumi = json.loads(Path("public/api/v1/torikumi.json").read_text(encoding="utf-8"))
          print(f"updatedAt={torikumi.get('updatedAt', '')}")
          print(f"resultUpdatedAt={torikumi.get('resultUpdatedAt', '')}")
          print(f"scheduleUpdatedAt={torikumi.get('scheduleUpdatedAt', '')}")
          PY

      - name: Check for schedule changes
        id: diff-check
        shell: bash
        run: |
          set -euo pipefail
          git add app/lib/torikumi-data.ts public/api/v1/torikumi.json
          if git diff --cached --quiet; then
            echo "::notice::No daily schedule changes to commit (generator ran but produced no diff)."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git restore --staged app/lib/torikumi-data.ts public/api/v1/torikumi.json
          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      - name: Create or update data update PR
        id: create-pr
        if: steps.diff-check.outputs.pr_created != 'false'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          branch: automation/schedule-updates
          branch-suffix: timestamp
          base: main
          delete-branch: false
          commit-message: 'chore: daily sumo schedule update'
          title: 'chore: automated torikumi schedule updates'
          body: |
            ## Summary
            - Automated data update from `${{ github.workflow }}`
            - Event: `${{ github.event_name }}`
            - Schedule: `${{ github.event.schedule || 'manual' }}`
            - Scope: `schedule`
          labels: |
            automated
            data-update
          add-paths: |
            app/lib/torikumi-data.ts
            public/api/v1/torikumi.json

      - name: Enable auto-merge
        id: auto-merge
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            echo "pull_request_number is empty; skipping auto-merge"
            exit 0
          fi
          echo "Enabling auto-merge for PR #${PR_NUMBER} (squash)"
          gh pr merge "${PR_NUMBER}" --auto --squash --delete-branch=false

      - name: Inspect current PR state
        id: pr-state
        if: always() && steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        shell: bash
        run: |
          gh pr view "$PR_NUMBER" --json state,mergeStateStatus,statusCheckRollup,url \
            --jq '"pr_state=" + .state + "\nmerge_state=" + .mergeStateStatus + "\nchecks=" + ([.statusCheckRollup[]?.conclusion // .statusCheckRollup[]?.status] | join(",")) + "\npr_url=" + .url' >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          DISCORD_STATUS="disabled"
          [ -n "${DISCORD_WEBHOOK_URL:-}" ] && DISCORD_STATUS="enabled"
          {
            echo "## Daily Sumo Data Update"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Generate | ${{ steps.generate.outcome }} |"
            echo "| Validate | ${{ steps.validate.outcome }} |"
            echo "| Diff check | ${{ steps.diff-check.outputs.pr_created == 'true' && 'changes detected' || (steps.diff-check.outcome == 'success' && 'no changes' || steps.diff-check.outcome) }} |"
            echo "| Create PR | ${{ steps.create-pr.outcome }} |"
            echo "| PR Number | ${{ steps.create-pr.outputs.pull-request-number }} |"
            echo "| PR Operation | ${{ steps.create-pr.outputs.pull-request-operation }} |"
            echo "| Auto-merge request | ${{ steps.auto-merge.outcome }} |"
            echo "| Current PR state | ${{ steps.pr-state.outputs.pr_state || 'unknown' }} |"
            echo "| Current merge state | ${{ steps.pr-state.outputs.merge_state || 'unknown' }} |"
            echo "| Current checks | ${{ steps.pr-state.outputs.checks || 'unknown; inspect PR link' }} |"
            echo ""
            if [ "${{ steps.generate.outcome }}" = "success" ]; then
              python scripts/ci/workflow_summary.py schedule public/api/v1/torikumi.json || echo "- generated data summary unavailable"
            else
              python scripts/ci/workflow_summary.py diagnostics "$RUNNER_TEMP/torikumi-generator.stderr" \
                "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                || echo "- diagnostics unavailable"
              echo ""
              echo "Existing JSON was preserved and is not reported as newly generated."
            fi
            echo "- event: \`${{ github.event_name }}\`"
            echo "- schedule: \`${{ github.event.schedule || 'manual' }}\`"
            echo "- jst_now: \`$(TZ=Asia/Tokyo date +'%Y-%m-%dT%H:%M:%S%z')\`"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- pr: ${{ steps.pr-state.outputs.pr_url || 'unknown; inspect run link' }}"
            echo "- discord alerts: \`${DISCORD_STATUS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: failure
          TITLE: 'Daily Sumo Data Update failed'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          detail=$(python scripts/ci/workflow_summary.py diagnostics "$RUNNER_TEMP/torikumi-generator.stderr" "${RUN_URL}" 2>/dev/null || echo "- diagnostics unavailable")
          bash scripts/ci/notify_discord.sh "${STATUS}" "${TITLE}" "${detail}" || echo "::warning::notify_discord failed"
