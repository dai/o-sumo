name: Daily Sumo Data Update
on:
  schedule:
    - cron: '0 4,6,8,10 * * *'
  workflow_dispatch:
# The caller must grant the permissions requested by the reusable workflow,
# even when its steps authenticate with GH_PAT.
permissions: {contents: write, checks: read, actions: read}
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/data-update.yml
    with:
      scope: schedule
      event_schedule: ${{ github.event.schedule || '' }}
    secrets: inherit
