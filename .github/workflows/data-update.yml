name: Serialized data publication
on:
  workflow_call:
    inputs:
      scope: {required: true, type: string}
      event_schedule: {required: false, default: '', type: string}
    secrets:
      GH_PAT: {required: true}
      DISCORD_WEBHOOK_URL: {required: false}
# Reusable workflow owns the write surface (push via GH_PAT) and needs to read
# check + actions results for delivery verification.
permissions: {contents: write, checks: read, actions: read}
jobs:
  publish:
    # Only publish on main; never against feature branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: osumo-data-writer, cancel-in-progress: false}
    outputs:
      commit_sha: ${{ steps.update.outputs.commit_sha }}
      pushed: ${{ steps.update.outputs.pushed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - id: update
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPDATE_SCOPE: ${{ inputs.scope }}
          EVENT_SCHEDULE: ${{ inputs.event_schedule }}
        run: python -m scripts.ci.run_data_update --scope "$UPDATE_SCOPE" --event-schedule "$EVENT_SCHEDULE"
      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/notify_discord.sh failure 'Serialized data publication failed' "$RUN_URL" || echo '::warning::notify_discord failed'
  delivery:
    # Defense in depth: publish already gates on main, but reaffirm here in
    # case this workflow is invoked through other paths in the future.
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.pushed == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.publish.outputs.commit_sha }}
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11'}
      - name: Verify delivery
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PUBLISHED_SHA: ${{ needs.publish.outputs.commit_sha }}
        run: python -m scripts.ci.check_data_delivery --repo "$GITHUB_REPOSITORY" --sha "$PUBLISHED_SHA" --timeout-seconds 600
      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/notify_discord.sh failure 'Serialized data delivery verification failed' "$RUN_URL" || echo '::warning::notify_discord failed'
