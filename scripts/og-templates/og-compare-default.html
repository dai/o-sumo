<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>o-sumo 力士比較 OGP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700;8..60,800&display=swap"
    />
    <link rel="stylesheet" href="./styles/og-banner.css" />
    <style>
      .og-banner {
        width: 1200px;
        height: 630px;
      }
      .og-banner__vs {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 2rem;
        margin-top: 1rem;
      }
      .og-banner__fighter {
        background: var(--tone-yugen-elevated);
        padding: 1.4rem 1.6rem;
        display: grid;
        gap: 0.5rem;
        border: 1px solid var(--tone-yugen-muted);
      }
      .og-banner__fighter--east {
        border-left: 6px solid var(--tone-yugen-slate);
      }
      .og-banner__fighter--west {
        border-left: 6px solid var(--tone-yugen-amber);
      }
      .og-banner__fighter-name {
        font-size: 2rem;
        font-weight: 800;
        color: var(--tone-yugen-text);
        letter-spacing: 0.02em;
      }
      .og-banner__fighter-meta {
        font-size: 0.95rem;
        color: var(--tone-yugen-text-muted);
        letter-spacing: 0.06em;
      }
      .og-banner__vs-badge {
        font-family: var(--font-serif);
        font-size: 2.4rem;
        font-weight: 800;
        color: var(--tone-yugen-vermilion);
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <main class="og-banner og-banner--left">
      <div class="og-banner__inner">
        <div class="og-banner__mark">
          <span class="og-banner__mark-glyph">大</span>
          <span class="og-banner__mark-text">o-sumo</span>
        </div>
        <span class="og-banner__rule"></span>
        <h1 class="og-banner__title" style="font-size: clamp(2.2rem, 4vw, 3.4rem);">
          立ち合いの「間」を、<br /><strong>合口から読み解く。</strong>
        </h1>
        <div class="og-banner__vs">
          <div class="og-banner__fighter og-banner__fighter--east">
            <span class="og-banner__fighter-meta">EAST</span>
            <span class="og-banner__fighter-name">東方</span>
          </div>
          <span class="og-banner__vs-badge">VS</span>
          <div class="og-banner__fighter og-banner__fighter--west">
            <span class="og-banner__fighter-meta">WEST</span>
            <span class="og-banner__fighter-name">西方</span>
          </div>
        </div>
        <p class="og-banner__subtitle">通算成績・体格・得意技・合口を一覧比較</p>
        <div class="og-banner__meta">
          <span class="og-banner__meta-dot"></span>
          <span>osada.us/compare/</span>
        </div>
      </div>
    </main>
  </body>
</html>
