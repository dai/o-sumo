<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>o-sumo Twitter ヘッダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700;8..60,800&display=swap"
    />
    <link rel="stylesheet" href="./styles/og-banner.css" />
    <style>
      .og-banner {
        width: 1500px;
        height: 500px;
      }
      .og-banner__title {
        font-size: clamp(2.2rem, 3.6vw, 3.4rem);
      }
      .og-banner__inner {
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 4rem;
        padding: 4% 6%;
      }
    </style>
  </head>
  <body>
    <main class="og-banner og-banner--left og-banner--compact">
      <div class="og-banner__inner">
        <div style="display: grid; gap: 1.2rem;">
          <div class="og-banner__mark">
            <span class="og-banner__mark-glyph">大</span>
            <span class="og-banner__mark-text">o-sumo</span>
          </div>
          <h1 class="og-banner__title">大相撲 — 番付・星取・取組を、<br /><strong>ひとつの場所で。</strong></h1>
          <p class="og-banner__subtitle">最新番付 / リアルタイム星取 / 力士名鑑 / データ分析</p>
          <div class="og-banner__meta">
            <span class="og-banner__meta-dot"></span>
            <span>osada.us</span>
            <span class="og-banner__meta-dot"></span>
            <span>Yūgen Tone</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
