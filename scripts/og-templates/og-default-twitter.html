<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>o-sumo Twitter ポスト OGP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700;8..60,800&display=swap"
    />
    <link rel="stylesheet" href="./styles/og-banner.css" />
    <style>
      .og-banner {
        width: 1200px;
        height: 675px;
      }
    </style>
  </head>
  <body>
    <main class="og-banner og-banner--center og-banner--wide">
      <div class="og-banner__inner">
        <div class="og-banner__mark">
          <span class="og-banner__mark-glyph">大</span>
          <span class="og-banner__mark-text">o-sumo</span>
        </div>
        <span class="og-banner__rule"></span>
        <h1 class="og-banner__title">立ち合いの「間」を、<br /><strong>読み解く。</strong></h1>
        <p class="og-banner__subtitle">最新番付 / リアルタイム星取 / 力士名鑑 / データ分析</p>
        <div class="og-banner__meta">
          <span class="og-banner__meta-dot"></span>
          <span>For Twitter / X</span>
          <span class="og-banner__meta-dot"></span>
        </div>
        <span class="og-banner__url">osada.us</span>
      </div>
    </main>
  </body>
</html>
